<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fixture: 新版淘宝 H5 详情页模拟</title>
<style>
body{margin:0;font-family:sans-serif}
.banner{display:flex;align-items:center;gap:8px;padding:8px;background:#fff}
.banner img{width:40px;height:40px}
.gallery{width:100vw;height:100vw;background-image:url("https://img.alicdn.com/imgextra/i4/3189900846/O1CN01OdPJWv1I7WBEIFR6m_!!3189900846.jpg_q50.jpg_.webp");background-size:cover}
.thumbs img{width:60px;height:60px}
.x{width:24px;height:24px;background:url(https://gw.alicdn.com/tfs/TB1QZN.CYj1gK0jSZFuXXcrHpXa-200-200.png) center/contain}
canvas{width:200px;height:200px}
</style></head><body>
<!-- 1. 顶部 "太好逛了吧 / 打开淘宝" 横幅：淘 logo（真实 URL，naturalWidth 268） -->
<div class="banner"><img src="https://img.alicdn.com/imgextra/i3/O1CN01GXym4K1qcq5dHLTgQ_!!6000000005517-2-tps-268-268.png"><b>太好逛了吧</b><span>打开淘宝</span><div class="x"></div></div>
<!-- 2. 主图：样式表里的 CSS 背景（不是 inline style） -->
<div class="gallery"></div>
<!-- 3. 缩略图条：同一张主图的 _80x80 缩略图（应去重） + TV 装饰素材 -->
<div class="thumbs"><img src="https://img.alicdn.com/imgextra/i4/3189900846/O1CN01OdPJWv1I7WBEIFR6m_!!3189900846.jpg_80x80.jpg_.webp"><img src="https://img.alicdn.com/imgextra/i2/O1CN010VLpQY1VWKHBQuBUQ_!!6000000002660-2-tps-222-222.png"></div>
<!-- 4. canvas 绘制的商品图 -->
<canvas id="cv" width="400" height="400"></canvas>
<!-- 5. Shadow DOM 里的 <img> -->
<div id="host"></div>
<!-- 6. 看了又看 推荐 -->
<div><img style="width:110px;height:110px" src="https://img.alicdn.com/imgextra/i1/3189900846/O1CN01Qmfakx1I7WBT7hXIV_!!3189900846.jpg_220x220.jpg"></div>
<!-- 7. 仅在内联脚本 JSON 里（SKU 图，未渲染） -->
<script>window.__INIT__={"item":{"images":["\/\/g-search2.alicdn.com\/img\/bao\/uploaded\/i4\/i1\/2214240553215\/O1CN01uTj6LC1ZcWP4BB2CG_!!4611686018427382015-0-item_pic.jpg"]}};</script>
<script>
var im=new Image();im.crossOrigin='anonymous';im.onload=function(){document.getElementById('cv').getContext('2d').drawImage(im,0,0,400,400)};
im.src='https://img.alicdn.com/imgextra/i2/3189900846/O1CN01HRFqCP1I7WBR6kDcD_!!3189900846.jpg';
var sr=document.getElementById('host').attachShadow({mode:'open'});
sr.innerHTML='<img style="width:300px;height:300px" src="https://img.alicdn.com/imgextra/i3/2218033562317/O1CN013siPx41SzEm9iYgnt_!!2218033562317.jpg">';
</script>
</body></html>
