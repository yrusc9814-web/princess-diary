name: my_wardrobe
description: 自用电子衣橱（本地存储 + 端侧抠图 + 天气穿搭推荐）
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  image: ^4.2.0
  onnxruntime: ^1.4.1
  http: ^1.2.2
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  archive: ^3.6.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/
